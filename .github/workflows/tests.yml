name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Run investment banking analysis
        run: |
          python main.py

      - name: Upload financial analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: investment-banking-analysis-outputs
          path: |
            figures/revenue_forecast.png
            figures/dcf_sensitivity.png
            figures/valuation_analysis.xlsx
          if-no-files-found: error
